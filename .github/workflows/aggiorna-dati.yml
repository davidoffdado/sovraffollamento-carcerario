name: Aggiorna dati carceri

on:
  schedule:
    # 05:00 UTC = 06:00/07:00 ora italiana a seconda dell'ora legale
    - cron: "0 5 * * *"
  workflow_dispatch: {}

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Installa pacchetti R
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::httr
            any::rvest
            any::dplyr
            any::purrr
            any::writexl
            any::future
            any::furrr
            any::openxlsx
            any::jsonlite
            any::future.apply
            any::googlesheets4
            any::tidyr
            any::readxl
            any::curl

      - name: Scrivi la chiave del service account Google
        run: echo '${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}' > gcp-sa.json

      - name: Aggiorna dati sovraffollamento
        env:
          GOOGLE_SA_KEY_PATH: gcp-sa.json
        run: Rscript sovraffollamento-carceri.R

      - name: Aggiorna dati morti in carcere
        env:
          GOOGLE_SA_KEY_PATH: gcp-sa.json
        run: Rscript morti-carcere.R

      - name: Rimuovi la chiave del service account
        if: always()
        run: rm -f gcp-sa.json
