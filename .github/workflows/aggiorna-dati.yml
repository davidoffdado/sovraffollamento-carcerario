name: Aggiorna dati carceri

on:
  schedule:
    # 05:00 UTC = 06:00/07:00 ora italiana a seconda dell'ora legale
    - cron: "0 5 * * *"
  workflow_dispatch: {}

# serve per fare il commit di data/storico-istituti.csv
permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Installa pacchetti R
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::httr
            any::rvest
            any::dplyr
            any::purrr
            any::writexl
            any::future
            any::furrr
            any::openxlsx
            any::jsonlite
            any::future.apply
            any::googlesheets4
            any::tidyr
            any::readxl
            any::curl

      - name: Scrivi la chiave del service account Google
        run: echo '${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}' > gcp-sa.json

      - name: Aggiorna dati sovraffollamento
        env:
          GOOGLE_SA_KEY_PATH: gcp-sa.json
        run: Rscript sovraffollamento-carceri.R

      # anche se lo step delle morti fallisce (es. Ristretti Orizzonti non risponde),
      # lo storico degli istituti della giornata viene salvato
      - name: Salva lo storico per istituto
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/storico-istituti.csv
          if git diff --cached --quiet; then
            echo "Storico invariato"
          else
            git commit -m "storico istituti $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Aggiorna dati morti in carcere
        env:
          GOOGLE_SA_KEY_PATH: gcp-sa.json
        run: Rscript morti-carcere.R

      - name: Rimuovi la chiave del service account
        if: always()
        run: rm -f gcp-sa.json
